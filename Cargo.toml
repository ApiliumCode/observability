[package]
name = "observability"
version = "0.1.4"
authors = ["freesig <tom.gowan@holo.host>", "AIngle Core Dev Team <devcore@aingle.ai>"]
edition = "2018"
description = "Experimental tracing ideas"
readme = "README.md"
license-file = "LICENSE"

[features]
default = []
# Note: opentelemetry-on feature is disabled by default due to incompatibility with tracing-subscriber 0.3
# Allows across thread and process tracing
opentelemetry-on = ["opentelemetry", "tracing-opentelemetry", "holochain_serialized_bytes", "serde", "serde_bytes"]
channels = ["tokio", "shrinkwraprs"]

[dependencies]
chrono = "0.4"
derive_more = "0.99"
inferno = "0.12"  # Updated from 0.10 - fixes quick-xml warning
serde_json = { version = "1.0", features = [ "preserve_order" ] }
thiserror = "1.0"
tracing = "0.1"
tracing-core = "0.1"
tracing-serde = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

opentelemetry = { version = "0.8", default-features = false, features = ["trace", "serialize"], optional = true }
tracing-opentelemetry = { version = "0.8.0", optional = true }
holochain_serialized_bytes = { version = "0.0", optional = true }
serde = { version = "1", optional = true }
serde_bytes = { version = "0.11", optional = true }
tokio = { version = "1", features = [ "sync" ], optional = true }  # Updated from 0.2
shrinkwraprs = { version = "0.3.0", optional = true }
once_cell = "1.5"

[dev-dependencies]
tokio = { version = "1", features = [ "full" ] }  # Updated from 0.2
tracing-futures = "0.2"
